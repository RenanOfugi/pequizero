<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="pequizero - pequi aberto">
  <!-- sombra de apoio -->
  <ellipse cx="128" cy="232" rx="92" ry="14" fill="#000000" opacity="0.10"/>

  <!-- casca verde externa (anel) -->
  <circle cx="128" cy="120" r="104" fill="#4C8B30"/>
  <!-- borda escura interna da casca (volume) -->
  <circle cx="128" cy="120" r="104" fill="none" stroke="#3C7325" stroke-width="6"/>
  <!-- brilho na casca -->
  <ellipse cx="92" cy="80" rx="30" ry="22" fill="#6CAE45" opacity="0.55" transform="rotate(-18 92 80)"/>

  <!-- polpa creme exposta -->
  <circle cx="128" cy="120" r="80" fill="#F3EFD2"/>
  <!-- sombra interna sutil da polpa -->
  <circle cx="128" cy="120" r="80" fill="none" stroke="#E4DCB0" stroke-width="4" opacity="0.6"/>

  <!-- caroços amarelos agrupados (3) — cor sólida, sem brilho -->
  <g>
    <ellipse cx="103" cy="112" rx="26" ry="28" fill="#F4A91E"/>
    <ellipse cx="153" cy="112" rx="26" ry="28" fill="#F4A91E"/>
    <ellipse cx="128" cy="150" rx="26" ry="26" fill="#F4A91E"/>
  </g>
</svg>
